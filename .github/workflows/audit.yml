name: "🌟 1llicit | 1llicit  🌟"

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read

jobs:
  # JOB 1: CHECK CODE QUALITY
  syntax-audit:
    name: "🔍 Logic & Syntax Audit"
    runs-on: ubuntu-latest
    steps:
      - name: "📦 Fetching Repository"
        uses: actions/checkout@v4

      - name: "🤖 Running ShellCheck"
        uses: ludeeus/action-shellcheck@master
        with:
          # Check your main scripts
          scandir: '.'
          severity: error

  # JOB 2: CHECK FOR LEAKED SECRETS
  security-sweep:
    name: "🔐 Secret Leak Detection"
    runs-on: ubuntu-latest
    steps:
      - name: "📦 Fetching Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🐧 Running Gitleaks"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
